# Production overlay for a single-host deployment.
#
# Usage:
#   cp .env.production.example .env.production
#   # replace every placeholder with a real secret/domain
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base Compose file remains intentionally convenient for local development.
# This overlay removes public data-service ports and adds the HTTPS edge proxy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    logging: *default-logging
    image: ${DOCUMIND_BACKEND_IMAGE:-documind-backend:local}
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  postgres:
    logging: *default-logging
    ports: !reset []
    networks:
      - data
    restart: unless-stopped

  redis:
    logging: *default-logging
    restart: unless-stopped
    networks:
      - data

  qdrant:
    logging: *default-logging
    ports: !reset []
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env.production}
    networks:
      - data

  backend:
    logging: *default-logging
    image: ${DOCUMIND_BACKEND_IMAGE:-documind-backend:local}
    build: !reset null
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    ports: !reset []
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - edge
      - data

  worker:
    logging: *default-logging
    image: ${DOCUMIND_BACKEND_IMAGE:-documind-backend:local}
    build: !reset null
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - data

  scheduler:
    logging: *default-logging
    image: ${DOCUMIND_BACKEND_IMAGE:-documind-backend:local}
    build: !reset null
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import os,pathlib,sys; p=pathlib.Path('/tmp/celerybeat.pid'); sys.exit(0 if p.exists() and os.path.exists(f'/proc/{p.read_text().strip()}') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - data

  frontend:
    logging: *default-logging
    image: ${DOCUMIND_FRONTEND_IMAGE:-documind-frontend:local}
    build: !reset null
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    ports: !reset []
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - edge

  proxy:
    logging: *default-logging
    image: caddy:2.10-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env.production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edge

  alertmanager:
    logging: *default-logging
    image: prom/alertmanager:v0.28.1
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - edge

  grafana:
    logging: *default-logging
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - edge

networks:
  edge:
  data:
    # Private from inbound host traffic while retaining outbound access for
    # Gemini, model downloads, and the private S3-compatible endpoint.

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  alertmanager_data:
