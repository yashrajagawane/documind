# Production overlay for a single-host deployment.
#
# Usage:
#   cp .env.production.example .env.production
#   # replace every placeholder with a real secret/domain
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base Compose file remains intentionally convenient for local development.
# This overlay removes public data-service ports and adds the HTTPS edge proxy.

services:
  postgres:
    ports: !reset []
    networks:
      - data
    restart: unless-stopped

  redis:
    restart: unless-stopped
    networks:
      - data

  qdrant:
    ports: !reset []
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env.production}
    networks:
      - data

  backend:
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    ports: !reset []
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - edge
      - data

  worker:
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.jobs.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - data

  scheduler:
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "beat", "--loglevel=INFO", "--pidfile=/tmp/celerybeat.pid"]
    healthcheck:
      test:
        ["CMD", "python", "-c", "import os,pathlib,sys; p=pathlib.Path('/tmp/celerybeat.pid'); sys.exit(0 if p.exists() and os.path.exists(f'/proc/{p.read_text().strip()}') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - data

  frontend:
    env_file: ${DOCUMIND_ENV_FILE:-.env.production}
    ports: !reset []
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - edge

  proxy:
    image: caddy:2.10-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN in .env.production}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
  data:
    # Private from inbound host traffic while retaining outbound access for
    # Gemini, model downloads, and the private S3-compatible endpoint.

volumes:
  caddy_data:
  caddy_config:
