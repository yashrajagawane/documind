name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: documind-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved release to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "release_tag must be a semantic version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable commit
        id: revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Capture commit SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable images
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ steps.sha.outputs.value }}
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          ssh -o BatchMode=yes "$STAGING_USER@$STAGING_HOST" \
            "cd '$STAGING_APP_DIR' && DOCUMIND_APP_DIR='$STAGING_APP_DIR' bash scripts/deploy_compose.sh '$RELEASE_SHA' '$image_prefix-backend:$RELEASE_SHA' '$image_prefix-frontend:$RELEASE_SHA'"

      - name: Run authenticated staging smoke checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check staging health and authentication
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          python -m pip install httpx==0.28.1
          python scripts/smoke_test.py --base-url "$STAGING_BASE_URL" --email "$SMOKE_EMAIL" --password "$SMOKE_PASSWORD"
