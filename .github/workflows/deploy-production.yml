name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag already qualified in staging
        required: true
        type: string
      backup_id:
        description: Verified pre-deploy backup identifier
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: documind-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved release to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "release_tag must be a semantic version tag such as v1.2.3" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable commit
        id: revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Capture commit SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immutable images
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ steps.sha.outputs.value }}
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$PRODUCTION_APP_DIR' && DOCUMIND_APP_DIR='$PRODUCTION_APP_DIR' bash scripts/deploy_compose.sh '$RELEASE_SHA' '$image_prefix-backend:$RELEASE_SHA' '$image_prefix-frontend:$RELEASE_SHA'"

      - name: Configure production smoke-test runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify production health and authentication
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          python -m pip install httpx==0.28.1
          python scripts/smoke_test.py --base-url "$PRODUCTION_BASE_URL" --email "$SMOKE_EMAIL" --password "$SMOKE_PASSWORD"

      - name: Capture production migration head
        id: migration
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_APP_DIR: ${{ vars.PRODUCTION_APP_DIR }}
        run: |
          migration_head="$(ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$PRODUCTION_APP_DIR' && docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml exec -T backend alembic current")"
          echo "value=$migration_head" >> "$GITHUB_OUTPUT"

      - name: Create sanitized release record
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ steps.sha.outputs.value }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MIGRATION_HEAD: ${{ steps.migration.outputs.value }}
          BACKUP_ID: ${{ inputs.backup_id }}
          ROLLBACK_BACKEND_IMAGE: ${{ vars.ROLLBACK_BACKEND_IMAGE }}
          ROLLBACK_FRONTEND_IMAGE: ${{ vars.ROLLBACK_FRONTEND_IMAGE }}
        run: |
          image_prefix="${IMAGE_PREFIX,,}"
          python scripts/create_release_record.py \
            --version "$RELEASE_TAG" \
            --commit "$RELEASE_SHA" \
            --backend-image "$image_prefix-backend:$RELEASE_SHA" \
            --frontend-image "$image_prefix-frontend:$RELEASE_SHA" \
            --migration-head "$MIGRATION_HEAD" \
            --backup-id "$BACKUP_ID" \
            --operator "$GITHUB_ACTOR" \
            --smoke-result passed \
            --rollback-backend-image "$ROLLBACK_BACKEND_IMAGE" \
            --rollback-frontend-image "$ROLLBACK_FRONTEND_IMAGE" \
            --output "artifacts/production-release-$RELEASE_TAG.json"

      - name: Upload production release record
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ steps.release.outputs.tag }}
          path: artifacts/production-release-${{ steps.release.outputs.tag }}.json
          if-no-files-found: error
          retention-days: 365
