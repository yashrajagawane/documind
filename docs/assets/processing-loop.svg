<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title description">
  <title id="title">DocuMind document processing loop</title>
  <desc id="description">A subtle animated line connects upload, structure, and grounded answer stages.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="958" height="228" rx="24" fill="#0b1020" stroke="#273449" stroke-width="2"/>
  <text x="40" y="48" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="2">FROM DOCUMENT TO EVIDENCE</text>
  <text x="40" y="74" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="13">A recoverable pipeline with locally generated embeddings</text>
  <path d="M185 145 H775" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M185 145 H775" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 18">
    <animate attributeName="stroke-dashoffset" from="168" to="0" dur="5s" repeatCount="indefinite"/>
  </path>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(185 145)">
      <circle r="25" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
      <circle r="8" fill="#a5b4fc"/>
      <circle r="12" fill="none" stroke="#818cf8" stroke-width="2" opacity=".55">
        <animate attributeName="r" values="12;23;12" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".55;0;.55" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text y="52" fill="#f8fafc" font-size="14" font-weight="600">Upload</text>
      <text y="72" fill="#94a3b8" font-size="11">Validate + store</text>
    </g>
    <g transform="translate(480 145)">
      <circle r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
      <circle r="8" fill="#7dd3fc"/>
      <circle r="12" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".55">
        <animate attributeName="r" values="12;23;12" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".55;0;.55" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text y="52" fill="#f8fafc" font-size="14" font-weight="600">Understand</text>
      <text y="72" fill="#94a3b8" font-size="11">Parse + index</text>
    </g>
    <g transform="translate(775 145)">
      <circle r="25" fill="#1e293b" stroke="#2dd4bf" stroke-width="3"/>
      <circle r="8" fill="#5eead4"/>
      <circle r="12" fill="none" stroke="#2dd4bf" stroke-width="2" opacity=".55">
        <animate attributeName="r" values="12;23;12" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".55;0;.55" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text y="52" fill="#f8fafc" font-size="14" font-weight="600">Answer</text>
      <text y="72" fill="#94a3b8" font-size="11">Retrieve + cite</text>
    </g>
  </g>
</svg>
